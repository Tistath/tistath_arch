#光标颜色跟随文字颜色
cursor                          none
#光标形状为方块
cursor_shape                    block
#在shell中保持方块
shell_integration               no-cursor
#非聚焦时空心
cursor_shape_unfocused          hollow
#开启光标拖尾
cursor_trail                    1
#拖尾存在时间范围
cursor_trail_decay              0.2 0.3
#触发拖尾最小阈值
cursor_trail_start_threshold    0
#光标闪烁淡入淡出
cursor_blink_interval           0.72 ease-in-out
#鼠标指针待机隐藏时间
mouse_hide_wait                 1.0
